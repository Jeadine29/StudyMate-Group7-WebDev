<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Study Schedule | StudyMate</title>
    <link rel="stylesheet" href="../css/main.css">
    <script src="../assets/studymate.js" defer></script>
</head>
<body>

<header class="app-header">
    <div class="container app-header-inner">
        <a class="app-brand" href="../index.html">StudyMate</a>

        <nav class="app-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="subjects.html">Subjects</a>
            <a href="schedule.html">Schedule</a>
            <a href="upload.html">Upload</a>
            <button data-logout class="btn btn-outline btn-sm">Log out</button>
        </nav>
    </div>
</header>

<main class="container page-shell">

    <div class="page-heading">
        <p class="eyebrow">PERSONAL STUDY PLANNER</p>
        <h1>My Study Schedule</h1>
        <p>Organize your own study activities.</p>
    </div>

    <section class="content-card">
        <h2>Add a Study Activity</h2>

        <form id="scheduleForm" class="form-stack">

            <label>
                Subject or Activity
                <input
                    type="text"
                    name="subject"
                    placeholder="Example: Computer Programming"
                    required
                >
            </label>

            <label>
                Day
                <select name="day" required>
                    <option value="">Select a day</option>
                    <option>Monday</option>
                    <option>Tuesday</option>
                    <option>Wednesday</option>
                    <option>Thursday</option>
                    <option>Friday</option>
                    <option>Saturday</option>
                    <option>Sunday</option>
                </select>
            </label>

            <label>
                Study Time
                <input type="time" name="time" required>
            </label>

            <button type="submit" class="btn btn-primary">
                Add Schedule
            </button>

        </form>
    </section>

    <section class="content-card">
        <h2>My Activities</h2>
        <div id="scheduleList">
            <p class="empty-state">No study schedule yet.</p>
        </div>
    </section>

    <div class="page-actions">
        <a href="dashboard.html" class="btn btn-outline">Back to Dashboard</a>
    </div>

</main>

</body>
</html>
