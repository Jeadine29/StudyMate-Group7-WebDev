
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | StudyMate</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/main.css">

    <script src="../assets/studymate.js" defer></script>
</head>

<body class="auth-page">

    <!-- StudyMate Project | Register Page | Assigned to: Jeadine -->

    <main class="auth-wrap">

        <section class="auth-card">

            <a class="app-brand auth-brand" href="../index.html">
                <img
                    src="../assets/studymate-logo.svg"
                    width="42"
                    height="42"
                    alt="StudyMate Logo"
                >

                <span>
                    StudyMate
                    <small>STUDY • FOCUS • LEARN</small>
                </span>
            </a>

            <div class="page-heading">
                <h1>Create Your Account</h1>
                <p>Set up your student profile to get started.</p>
            </div>

            <form id="registerForm" class="form-stack">

                <label for="registerName">
                    Full Name
                    <input
                        type="text"
                        id="registerName"
                        name="fullname"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </label>

                <label for="registerEmail">
                    Email Address
                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </label>

                <label for="registerPassword">
                    Password
                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >
                </label>

                <label for="confirmPassword">
                    Confirm Password
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >
                </label>

                <button
                    type="submit"
                    class="btn btn-primary btn-full"
                >
                    Create Account
                </button>

            </form>

            <p class="auth-note">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

            <a class="text-link" href="../index.html">
                ← Back to Home
            </a>

            <p class="demo-note">
                Demo only: Account information is stored in this browser
                and is not saved on a secure server.
            </p>

        </section>

    </main>

</body>
</html>
